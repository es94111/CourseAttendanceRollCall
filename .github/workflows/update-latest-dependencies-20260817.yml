name: Update dependencies to latest
on:
  push:
    branches: [chore/update-dependencies-20260817]
    paths: [.github/workflows/update-latest-dependencies-20260817.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with: {ref: chore/update-dependencies-20260817}
      - uses: actions/setup-node@v6.4.0
        with: {node-version: '24', check-latest: true}
      - name: Upgrade npm dependencies to latest compatible versions
        shell: bash
        run: |
          set -euo pipefail
          # TypeScript 7.0.2 cannot resolve with current latest typescript-eslint 8.67.0,
          # whose peer range is >=4.8.4 <6.1.0. Keep the existing compatible TypeScript 6.0.3.
          npx --yes npm-check-updates@latest --deep --upgrade --target latest --reject typescript
          while IFS= read -r -d '' lock; do dir="$(dirname "$lock")"; (cd "$dir" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund); done < <(find . -type f -name package-lock.json -not -path '*/node_modules/*' -print0)
      - name: Commit dependency updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(deps): update dependencies to latest compatible versions"
          git push origin HEAD:chore/update-dependencies-20260817
