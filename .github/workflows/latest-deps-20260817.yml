name: Validate latest dependencies

on:
  push:
    branches: [chore/latest-deps-20260817]
    paths: [.github/workflows/latest-deps-20260817.yml]

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/latest-deps-20260817
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Upgrade direct dependencies and install TS7 side-by-side
        run: |
          npx --yes npm-check-updates@latest -u --target latest
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const ts7 = cp.execFileSync('npm', ['view', 'typescript', 'version'], {encoding:'utf8'}).trim();
          const ts6 = cp.execFileSync('npm', ['view', '@typescript/typescript6', 'version'], {encoding:'utf8'}).trim();
          pkg.devDependencies.typescript = `npm:@typescript/typescript6@^${ts6}`;
          pkg.devDependencies['@typescript/native'] = `npm:typescript@^${ts7}`;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install
      - name: Confirm all ordinary direct dependencies are current
        run: npx --yes npm-check-updates@latest --target latest --reject typescript,@typescript/native --errorLevel 2
      - name: Confirm compiler and tooling compatibility packages are current
        run: |
          node - <<'NODE'
          const cp = require('child_process');
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const expected7 = cp.execFileSync('npm',['view','typescript','version'],{encoding:'utf8'}).trim();
          const tagged6 = cp.execFileSync('npm',['view','@typescript/typescript6','version'],{encoding:'utf8'}).trim();
          if (!pkg.devDependencies['@typescript/native'].includes(expected7)) throw new Error('TS7 alias is not current');
          if (!pkg.devDependencies.typescript.includes(tagged6)) throw new Error('TS6 compatibility API range does not include the current dist-tag');
          const installed6 = require('typescript/package.json').version;
          const nums = (v) => v.split('.').map(Number);
          const compare = (a,b) => { const x=nums(a), y=nums(b); for(let i=0;i<3;i++){ if(x[i]!==y[i]) return x[i]-y[i]; } return 0; };
          if (compare(installed6, tagged6) < 0) throw new Error(`Installed TS6 compatibility API ${installed6} is older than ${tagged6}`);
          console.log(`TypeScript compatibility API: ${installed6} (dist-tag ${tagged6})`);
          NODE
          npx tsc --version
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated dependency update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/latest-deps-20260817.yml
          git add package.json package-lock.json .npmrc
          git commit -m "chore(deps): run TypeScript 7 with current tooling compatibility API"
          git push origin HEAD:chore/latest-deps-20260817
