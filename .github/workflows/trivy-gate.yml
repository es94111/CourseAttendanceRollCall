# 容器掃描(private 免費版):掃到 CRITICAL/HIGH 就讓 CI 失敗,結果印在 log,
# 不上傳 Security 頁籤(故不需 GHAS)。
name: Trivy (container scan)

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # 每週一 11:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Build & scan image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: app:scan
          build-args: |
            DATABASE_URL=postgresql://postgres:password@localhost:5432/rollcall
            NEXTAUTH_URL=http://localhost:3000
            NEXTAUTH_SECRET=ci-nextauth-secret-with-at-least-thirty-two-chars
            GOOGLE_CLIENT_ID=ci-google-client-id
            GOOGLE_CLIENT_SECRET=ci-google-client-secret
            QR_SECRET=ci-qr-secret-with-at-least-thirty-two-characters
            ADMIN_EMAILS=admin@example.edu
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
