name: Secret scan (gitleaks)

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # 每週一 01:00 UTC = 09:00 Asia/Taipei
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0          # 排程要掃全歷史,必須抓完整 history
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # organization 帳號才需要 GITLEAKS_LICENSE;personal repo 留空即可
